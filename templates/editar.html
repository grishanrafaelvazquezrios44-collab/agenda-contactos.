{% extends "base.html" %}

{% block contenido %}

<section class="panel">
    <h2>✏️ Editar contacto</h2>

    <form method="POST">
        <input type="text" name="nombre"
               value="{{ contacto.nombre }}"
               placeholder="Nombre" required>

        <input type="tel" name="telefono"
               value="{{ contacto.telefono }}"
               placeholder="Teléfono" required>

        <input type="email" name="correo"
               value="{{ contacto.correo or '' }}"
               placeholder="Correo">

        <select name="categoria" required>
            <option value="">Selecciona categoría</option>
            {% for cat in ['Familia', 'Amigos', 'Escuela', 'Trabajo', 'Otros'] %}
                <option value="{{ cat }}"
                    {% if contacto.categoria == cat %}selected{% endif %}>
                    {{ cat }}
                </option>
            {% endfor %}
        </select>

        <label>Cumpleaños</label>
        <input type="date" name="cumpleanos"
               value="{{ contacto.cumpleanos or '' }}">

        <textarea name="notas"
                  placeholder="Notas">{{ contacto.notas or '' }}</textarea>

        <button type="submit">Guardar cambios</button>
        <a href="{{ url_for('inicio') }}">Cancelar</a>
    </form>
</section>

{% endblock %}
